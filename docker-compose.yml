services:
  postgres:
    image: postgres:16-alpine
    container_name: cassandra-postgres
    environment:
      POSTGRES_USER: cassandra
      POSTGRES_PASSWORD: cassandra
      POSTGRES_DB: cassandra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cassandra"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
